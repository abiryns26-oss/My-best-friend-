<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستشار النفسي الذكي - تفريغ وتحليل الأفكار</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border-color: #cbd5e1;
            --danger-color: #dc2626;
            --section-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.7;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
            min-height: 120px;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .output-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .output-box {
            background-color: var(--section-bg);
            border-right: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .output-box h3 {
            color: var(--accent-color);
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
            text-align: center;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background-color: #0f766e;
        }

        .btn-clear {
            background-color: #475569;
        }
        .btn-clear:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>المستشار النفسي الذكي (صديقي)</h1>
        <p>اكتب ما يدور في ذهنك وما تواجههن من مشكلة، وسيقوم بتحليلها وتقديم رؤية نفسية وحلول عملية</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="userThoughts">ماذا تفكر وما هي المشكلة باختصار؟ (أفرغ مشاعرك هنا):</label>
            <textarea id="userThoughts" placeholder="مثال: طلب مني زوجي المساعدة المادية ولديه دين خارجي..."></textarea>
        </div>

        <button class="btn" onclick="analyzeProblem()">🧠 تحليل المشكلة وتقديم الرأي الاستشاري</button>
        <div id="status" class="status-text"></div>

        <div id="resultsArea" class="output-container" style="display: none;">
            <div class="output-box">
                <h3>📌 تلخيص المشكلة وجوهرها:</h3>
                <p id="summaryText"></p>
            </div>

            <div class="output-box" style="border-right-color: #2563eb;">
                <h3 style="color: #2563eb;">💡 الحلول العملية المقترحة:</h3>
                <p id="solutionsText"></p>
            </div>

            <div class="output-box" style="border-right-color: #d97706;">
                <h3 style="color: #d97706;">🌱 الرأي النفسي والاستشاري:</h3>
                <p id="psyOpinionText"></p>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-clear" onclick="clearAll()">🗑️ مسح والبدء من جديد</button>
        </div>
    </div>

    <script>
        function analyzeProblem() {
            const input = document.getElementById('userThoughts').value.trim();
            const statusBox = document.getElementById('status');
            const resultsArea = document.getElementById('resultsArea');

            if (!input) {
                alert('الرجاء كتابة ما تفكر به أولاً!');
                return;
            }

            statusBox.innerText = "جاري تحليل المشكلة وصياغة الرأي الاستشاري...";
            
            setTimeout(() => {
                generateDynamicResponse(input);
                statusBox.innerText = "تم إعداد التحليل والاستشارة بنجاح ✅";
                resultsArea.style.display = "grid";
            }, 600);
        }

        function generateDynamicResponse(text) {
            let summary = "";
            let solutions = "";
            let psyOpinion = "";

            const textLower = text.toLowerCase();

            // تحليل مخصص لمشكلة المساعدة المالية والدين (بناءً على مثالك الأخير)
            if (textLower.includes('مال') || textLower.includes('دين') || textLower.includes('مساعدة') || textLower.includes('زوج') || textLower.includes('قرض')) {
                summary = `المشكلة تتعلق بحيرة اتخاذ قرار بشأن 'تقديم أو عدم تقديم مساعدة مالية للزوج لدفع دين خارجي'، وتدور حول تقاطع الشعور بالمسؤولية العائلية المشتركة مع الخوف من تحمل أعباء مالية أو التأثير على الأمان المادي الشخصي. النص المدخل: "${text.substring(0, 100)}..."`;
                
                solutions = "1. فتح حوار شفاف ومريح حول الوضع المالي الكلي للأسرة وكيفية نشوء هذا الدين الخارجي.<br>2. تقييم القدرة المالية الشخصية بدقة ودون ضغط أو إحراج، وتحديد ما إذا كانت المساعدة ممكنة جزئياً أو كلياً دون الإضرار بالاستقرار الشخصي.<br>3. الاتفاق على خطة واضحة ومتبادلة لسداد الديون المستقبلية لتجنب تكرار الضغط المالي.";
                
                psyOpinion = "من الناحية النفسية والعلاقات الأسرية، المواقف المالية غالباً ما تثير مشاعر حساسة تتعلق بالأمان والثقة المتبادلة. قول 'لا' أو التردد لا يعني بالضرورة غياب الدعم، بل قد يعكس حرصاً على استقرار الأسرة المالي. من المهم الفصل بين التعاطف العاطفي وبين القدرة المالية الفعلية، والتعبير عن الرأي بصدق ولطف لئلا يتراكم شعور بالاستياء أو الضغط الداخلي.";
            } 
            // تحليل عام ومتكيف مع أي نص آخر
            else {
                summary = `تتلخص المشكلة في مواجهة موقف ضاغط أو مشاعر معقدة تتطلب اتخاذ قرار واعي وهادئ. النص المدخل: "${text.substring(0, 100)}..."`;
                
                solutions = "1. منح النفس مساحة من الهدوء وتأجيل الرد الحاسم حتى يزول التوتر المؤقت.<br>2. تفكيك المشكلة إلى نقاط صغيرة وتحديد ما يمكنك التحكم به وما هو خارج عن إرادتك.<br>3. مصارحة الطرف الآخر أو المعنيين بهدوء وبصيغة تعبر عن مشاعرك بوضوح.";
                
                psyOpinion = "يشير علم النفس السلوكي إلى أن الضغوط اليومية قد تضخم حجم المشكلات نظراً لشحنها العاطفي. التراجع خطوة للوراء والنظر للموقف بموضوعية يقلل من القلق، ويساعد العقل على إيجاد خيارات بديلة لم تكن واضحة وقت حدة التوتر.";
            }

            document.getElementById('summaryText').innerHTML = summary;
            document.getElementById('solutionsText').innerHTML = solutions;
            document.getElementById('psyOpinionText').innerHTML = psyOpinion;
        }

        function clearAll() {
            document.getElementById('userThoughts').value = "";
            document.getElementById('resultsArea').style.display = "none";
            document.getElementById('status').innerText = "";
            document.getElementById('userThoughts').focus();
        }
    </script>
</body>
</html>
